name: VM KVM dengan Virt-Install & Auto-Save
on: workflow_dispatch

env:
  LIBVIRT_DEFAULT_URI: 'qemu:///system'

jobs:
  run-vm:
    runs-on: ubuntu-latest
    steps:
    - name: Clone Repositori
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Instal KVM, Virt-Install, Alat Jaringan & Git LFS
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm libvirt-daemon-system virtinst websockify novnc ssh osinfo-db-tools git-lfs
        git lfs install

    - name: Konfigurasi Hak Akses KVM & Libvirt
      run: |
        sudo chmod 666 /dev/kvm
        sudo chmod 666 /var/run/libvirt/libvirt-sock

    - name: Jalankan Libvirtd Tanpa Systemd
      run: |
        sudo /usr/sbin/libvirtd -d
        sleep 5

    - name: Cek Harddisk Lama (Auto-Load) atau Siapkan Installer Baru
      run: |
        # Membuat folder internal libvirt jika belum ada
        sudo mkdir -p /var/lib/libvirt/images/
        sudo chmod 777 /var/lib/libvirt/images/

        if [ -f "win11-vm.qcow2" ]; then
          echo "Harddisk dari sesi kemarin ditemukan! Memindahkannya ke sistem libvirt..."
          sudo mv win11-vm.qcow2 /var/lib/libvirt/images/win11-vm.qcow2
          echo "BOOT_MODE=saved" >> $GITHUB_ENV
        else
          echo "Harddisk tidak ditemukan. Menyiapkan instalasi baru dari ISO..."
          echo "Unduh ISO Windows 11..."
          wget "https://software.download.prss.microsoft.com/dbazure/Win11_25H2_English_x64_v2.iso?t=8860a928-86ac-4e3a-9517-df1595cbc93e&P1=1789375154&P2=602&P3=2&P4=c3Ofs2lZO9pnUr6hw6wpQIlg2OauaFtjJcBJ45In8UunTLerNhmJECP1m7sdtYLhcueij3NqCyWyBVloWq9Bqp%2f4L8Tt7%2fdmd3zlu9fYF81ljhG9X7F%2fhqlw%2fcPNLUkBi%2bHTV3H8zo5tEH7zaXxU7XgiNK6PpoIsNnqrDzuh9hkKSeWPPxixoTqNXN9%2b3jDnxjZlVMl%2bfKpTHxtEmbUI9yhiqHEaM1PRl7iH1IGKjloa2iztO37OI8TrPU%2bO0lzTeLhZqUS2yXskv1cLPwxxfPyG74klBNbdpygsoJnBBXcnZn5ASchcBM5iWQAYiMOe%2bmYssKZHSmey3hlVBnk0eg%3d%3d" -O installer.iso
          echo "BOOT_MODE=new" >> $GITHUB_ENV
        fi

    - name: Jalankan VM Menggunakan Virt-Install
      run: |
        if [ "${{ env.BOOT_MODE }}" = "new" ]; then
          echo "Memulai VM baru dari CD-ROM..."
          sudo virt-install \
            --name=win11-vm \
            --ram=6914 \
            --vcpus=2 \
            --cpu host \
            --disk path=/var/lib/libvirt/images/win11-vm.qcow2,size=64,format=qcow2,bus=virtio \
            --cdrom=installer.iso \
            --os-variant=generic \
            --network network=default \
            --graphics vnc,listen=0.0.0.0,port=5901 \
            --noautoconsole \
            --wait=0
        else
          echo "Memulai VM melanjutkan sesi kemarin..."
          # Jika melanjutkannya, kita tidak perlu memasukkan argumen --cdrom lagi
          sudo virt-install \
            --name=win11-vm \
            --ram=6914 \
            --vcpus=2 \
            --cpu host \
            --disk path=/var/lib/libvirt/images/win11-vm.qcow2,format=qcow2,bus=virtio \
            --import \
            --os-variant=generic \
            --network network=default \
            --graphics vnc,listen=0.0.0.0,port=5901 \
            --noautoconsole \
            --wait=0
        fi

    - name: Jembatani dengan Websockify & Buka Jalur Link Browser
      run: |
        websockify --web /usr/share/novnc/ 6080 localhost:5901 &
        sleep 5
        ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=5 -R 80:localhost:6080 nokey@localhost.run > tunnel.log 2>&1 &
        sleep 5
        cat tunnel.log
        
        echo "========================================================================"
        echo "VM KAMU AKTIF! UNTUK MENYIMPAN PERUBAHAN SECARA OTOMATIS KE GITHUB:"
        echo "SHUTDOWN ATAU MATIKAN OS DI DALAM LAYAR noVNC KAMU."
        echo "========================================================================"

    - name: Menunggu VM Dimatikan (Auto-Save Trigger)
      run: |
        # Memantau status VM via virsh. Jika win11-vm dimatikan (shut off), loop ini selesai.
        while sudo virsh list --name | grep -q "win11-vm"; do
          sleep 5
        done
        echo "VM terdeteksi mati secara aman. Memulai penarikan berkas harddisk..."

    - name: Auto-Save Perubahan Harddisk ke GitHub
      run: |
        # Ambil kembali file qcow2 dari folder sistem ke folder repositori
        sudo mv /var/lib/libvirt/images/win11-vm.qcow2 ./win11-vm.qcow2
        sudo chmod 666 win11-vm.qcow2

        # Konfigurasi Git Bot
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # Daftarkan ke Git LFS agar file besar tidak diblokir GitHub
        git lfs track "*.qcow2"
        git add .gitattributes
        
        # Lakukan Push otomatis perubahan harddisk kamu ke repositori
        git add win11-vm.qcow2
        git commit -m "Auto-Save: Memperbarui berkas sistem virt-install sesi terakhir"
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
